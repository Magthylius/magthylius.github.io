<!DOCTYPE html>
<html>

<head>
    <title>Magthylius</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="parallax-bg">
        <div>
            <p id="parallax-label">
                MAGTHYLIUS
            </p>
        </div>
    </div>
    
    <script>
        var parallax = document.getElementById("parallax-bg");
        document.addEventListener("mousemove", function (e) {
            var x = e.clientX;
            var y = e.clientY;
            parallax.style.transform = "translate(" + x / 50 + "px, " + y / 50 + "px)";
        });
    </script>
</body>

</html>
