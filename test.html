<!DOCTYPE html>
<html>

<head>
    <title>Parallax Effect</title>
    <style>
        body {
            margin: auto;
            top: 0;
			left: 0;
			right: 0;
			bottom: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
			justify-content: center;
			align-items: center;
        }

        #parallax {
            object-fit: contain;
            position: relative;
            height: 100vh;
            width: 100vh;
            background-image: url('Mags 5 Black.png');
            background-size: cover;
            background-position: center;
            transition: transform 0.2s ease-out;
        }

        #parallax:hover {
            transform: scale(1.1);
        }
    </style>
</head>

<body>
    <div id="parallax"></div>
    <script>
        var parallax = document.getElementById("parallax");
        document.addEventListener("mousemove", function (e) {
            var x = e.clientX;
            var y = e.clientY;
            parallax.style.transform = "translate(-" + x / 50 + "px, -" + y / 50 + "px)";
        });
    </script>
</body>

</html>
