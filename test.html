<!DOCTYPE html>
<html>

<head>
    <title>Parallax Effect</title>
    <style>
        body {
            margin: auto;
            height: 50%;
            overflow: hidden;
            display: flex;
			justify-content: center;
			align-items: center;
            background-color: #212932ff;
        }

        #parallax {
            position: absolute;
            margin: auto;
            
            top:0;
            bottom: 0;
            left: 0;
            right: 0;

            height: 50vh;
            width: 50vh;

            object-fit: contain;

            background-image: url("Mags 5 White.png");
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            transition: transform 0.2s ease-out;
        }

        #parallax::before {
            background-color: rgba(255, 0, 0, 0.5);
        }

        #parallax:hover {
            transform: scale(1.1);
        }
    </style>
</head>

<body>
    <div id="parallax"></div>
    <script>
        var parallax = document.getElementById("parallax");
        document.addEventListener("mousemove", function (e) {
            var x = e.clientX;
            var y = e.clientY;
            parallax.style.transform = "translate(" + x / 50 + "px, " + y / 50 + "px)";
        });
    </script>
</body>

</html>
