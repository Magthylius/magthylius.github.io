<!DOCTYPE html>
<html>
<head>
	<title>Floating Parallax Background Logo</title>
	<style>
		body {
			margin: 0;
			padding: 0;
			background-color: #FFF;
			color: #fff;
			font-family: Arial, sans-serif;
			font-size: 16px;
			line-height: 1.5;
			height: 100%;
		}
		
		.logo {
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			z-index: -1;
			width: 50vh;
			height: 50vh;
			background-image: url('Mags 5 Black.png');
			background-repeat: no-repeat;
			background-size: contain;
			animation: parallax 10s linear infinite;
			display: flex;
			justify-content: center;
			align-items: center;
		}

		img {
			max-width: 100%;
			max-height: 100%;
		}
		
		@keyframes parallax {
			from {
				transform: translate(-50%, -50%) translateZ(0);
			}
			to {
				transform: translate(-50%, -50%) translateZ(-500px);
			}
		}
	</style>
</head>
<body>
	<div class="logo">
		<!--
		<img src="Mags 5 Black.png" alt="Magthylius' Logo" class="logo">
		-->
	</div>
</body>
</html>
